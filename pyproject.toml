[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-multi-agent-negotiation"
version = "0.1.0"
description = "A deterministic multi-agent negotiation simulation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
openai = ["openai>=1.68,<3"]
ui = ["streamlit>=1.30,<2"]

[project.scripts]
llm-negotiation = "llm_negotiation.cli:main"
llm-negotiation-experiment = "llm_negotiation.experiment_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "live_api: opt-in tests that may call a configured external LLM provider",
]
